# ─────────────────────────────────────────────────────────────────
# nginx reverse-proxy config for PERA Bodycam.
# Routes everything through one origin so the browser never sees
# cross-origin calls — no CORS gymnastics.
#
#   /          → React static files (built by vite build)
#   /api/      → .NET API (port 8080)
#   /py-api/   → Python ML (port 5050) — internal use only
#   /socket.io/→ Python ML websocket (live alerts)
# ─────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    client_max_body_size 2g;   # bodycam clips can be hundreds of MB

    # ── React frontend ──────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # ffmpeg.wasm needs SharedArrayBuffer → these CO* headers
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Opener-Policy   same-origin   always;
    }

    # ── .NET API (recordings, officers, watch-folder, analyse) ──
    location /api/ {
        proxy_pass         http://dotnet:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Long-running uploads (Gemini analysis can take 5+ min)
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_request_buffering off;
    }

    # ── Python ML pipeline ──────────────────────────────────────
    # Stripped prefix so /py-api/health on the outside hits /api/health inside.
    location /py-api/ {
        proxy_pass         http://python:5050/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    # ── Live websocket for real-time alerts (Python SocketIO) ──
    location /socket.io/ {
        proxy_pass         http://python:5050/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_read_timeout  86400;   # keep socket open
    }
}
